services:
  postgres:
    image: postgres:16-alpine
    container_name: certipulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: certipulse
      POSTGRES_USER: certipulse
      POSTGRES_PASSWORD: certipulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certipulse -d certipulse"]
      interval: 10s
      timeout: 5s
      retries: 10

  certipulse:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: certipulse_app

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://certipulse:certipulse@postgres:5432/certipulse?schema=public

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - uuassets_data:/app/public/uuassets

volumes:
  postgres_data:
  uuassets_data: